<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="مسیر سفارش تا تحویل سایت">
  <defs>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7A00F0" stop-opacity=".22"/><stop offset="1" stop-color="#ED1908" stop-opacity=".06"/></linearGradient>
    <linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7A00F0"/><stop offset="1" stop-color="#4A0099"/></linearGradient>
    <linearGradient id="l" x1="1" x2="0"><stop offset="0" stop-color="#7A00F0"/><stop offset="1" stop-color="#ED1908"/></linearGradient>
  </defs>
  <rect width="1200" height="230" rx="24" fill="#0A0A10"/>
  <line x1="150" y1="78" x2="1050" y2="78" stroke="url(#l)" stroke-width="3" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" values="0;-32" dur="1.2s" repeatCount="indefinite"/></line>
  <g font-family="Vazirmatn, Vazir, Tahoma, sans-serif" text-anchor="middle" direction="rtl">
    <g transform="translate(1050 0)"><circle cy="78" r="38" fill="url(#n)"/><text y="90" font-size="30">📦</text><text y="150" fill="#F0EDF5" font-size="17" font-weight="700">۱. انتخاب پلن</text><text y="176" fill="#A99BC8" font-size="13">هاست cPanel</text></g>
    <g transform="translate(870 0)"><circle cy="78" r="38" fill="url(#n)"/><text y="90" font-size="30">🔗</text><text y="150" fill="#F0EDF5" font-size="17" font-weight="700">۲. دامنه</text><text y="176" fill="#A99BC8" font-size="13">ثبت یا اتصال</text></g>
    <g transform="translate(690 0)"><circle cy="78" r="38" fill="url(#n)"/><text y="90" font-size="30">🧩</text><text y="150" fill="#F0EDF5" font-size="17" font-weight="700">۳. نوع سایت</text><text y="176" fill="#A99BC8" font-size="13">۱۲ قالب آماده</text></g>
    <g transform="translate(510 0)"><circle cy="78" r="38" fill="url(#n)"/><text y="90" font-size="30">✨</text><text y="150" fill="#F0EDF5" font-size="17" font-weight="700">۴. توصیف کسب‌وکار</text><text y="176" fill="#A99BC8" font-size="13">بهبود با هوش مصنوعی</text></g>
    <g transform="translate(330 0)"><circle cy="78" r="38" fill="url(#n)"/><text y="90" font-size="30">💳</text><text y="150" fill="#F0EDF5" font-size="17" font-weight="700">۵. پرداخت</text><text y="176" fill="#A99BC8" font-size="13">ورود با پیامک</text></g>
    <g transform="translate(150 0)"><circle cy="78" r="44" fill="#ED1908"><animate attributeName="r" values="40;46;40" dur="2s" repeatCount="indefinite"/></circle><text y="90" font-size="30">🚀</text><text y="150" fill="#F0EDF5" font-size="17" font-weight="700">۶. تحویل خودکار</text><text y="176" fill="#A99BC8" font-size="13">سایت + پنل مدیریت</text></g>
  </g>
</svg>
